[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-tracker"
version = "0.1.0"
description = "Track time spent focusing on different activities, from the terminal or the browser."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=2.0", "python-dotenv>=1.0"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=2.0", "python-dotenv>=1.0", "httpx>=0.27"]

[project.scripts]
focus = "focus_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["focus_tracker*"]

[tool.setuptools.package-data]
"focus_tracker.web" = ["static/*.html", "static/css/*.css", "static/js/*.js", "static/js/views/*.js"]
